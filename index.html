<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEON STRIKE 1984 - Retro Space Shooter</title>
  <!-- Load Tailwind CSS for UI controls -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Press Start 2P Font for Retro Styling -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <style>
    * {
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background-color: #050508;
      font-family: 'Press Start 2P', monospace, sans-serif;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    /* CRT Scanline FX overlay */
    .crt-lines {
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.35) 50%
      );
      background-size: 100% 4px;
      pointer-events: none;
    }
    /* Neon Glow Effects */
    .glow-cyan { text-shadow: 0 0 8px #00f0ff, 0 0 16px #00f0ff; }
    .glow-pink { text-shadow: 0 0 8px #ff007f, 0 0 16px #ff007f; }
    .glow-gold { text-shadow: 0 0 8px #ffd700, 0 0 16px #ffd700; }
    
    .btn-arcade {
      background: linear-gradient(180deg, #ff007f 0%, #b30059 100%);
      box-shadow: 0 6px 0 #660033, 0 0 15px rgba(255, 0, 127, 0.6);
      transition: all 0.1s ease;
    }
    .btn-arcade:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #660033, 0 0 8px rgba(255, 0, 127, 0.8);
    }
    canvas {
      display: block;
      background: #020205;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen text-white relative">

  <!-- CRT Overlay -->
  <div class="crt-lines fixed inset-0 z-30"></div>

  <!-- Game Container -->
  <div id="game-container" class="relative w-full max-w-2xl h-[100vh] sm:h-[90vh] sm:max-h-[800px] border-0 sm:border-2 border-cyan-500/30 sm:rounded-2xl overflow-hidden shadow-[0_0_50px_rgba(0,240,255,0.2)]">
    
    <!-- Canvas Element -->
    <canvas id="gameCanvas" class="w-full h-full"></canvas>

    <!-- Top HUD Bar -->
    <div id="hud" class="absolute top-0 left-0 w-full p-4 flex justify-between items-center text-[10px] sm:text-xs z-20 pointer-events-none hidden">
      <div class="flex flex-col gap-1">
        <span class="text-slate-400">SCORE</span>
        <span id="score-val" class="text-cyan-400 text-sm sm:text-base glow-cyan">0</span>
      </div>
      <div class="flex flex-col items-center gap-1">
        <span id="combo-text" class="text-pink-500 font-bold opacity-0 transition-opacity duration-200">2x COMBO!</span>
        <div id="lives-container" class="flex gap-1 text-pink-500 text-sm sm:text-base"></div>
      </div>
      <div class="flex flex-col items-end gap-1">
        <span class="text-slate-400">HIGH</span>
        <span id="high-val" class="text-yellow-400 text-sm sm:text-base glow-gold">0</span>
      </div>
    </div>

    <!-- Start Overlay Screen -->
    <div id="start-screen" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-20">
      <h1 class="text-2xl sm:text-4xl font-extrabold text-pink-500 glow-pink tracking-widest mb-2 leading-tight">NEON STRIKE<br><span class="text-cyan-400 glow-cyan text-3xl sm:text-5xl">1984</span></h1>
      <p class="text-[10px] sm:text-xs text-cyan-300/80 mb-8 max-w-xs leading-relaxed">DEFEND THE CYBERSPACE FROM THE ALIEN GRID INVASION</p>

      <button id="start-btn" onclick="startGame()" class="btn-arcade px-8 py-4 rounded-xl text-xs sm:text-sm tracking-wider font-bold text-white mb-6 cursor-pointer">
        PLAY NOW
      </button>

      <div class="flex items-center gap-2 mb-6">
        <button id="bgm-toggle" onclick="toggleAudio()" class="px-3 py-2 bg-slate-800 border border-cyan-500/40 rounded-lg text-[9px] sm:text-[10px] text-cyan-400 cursor-pointer hover:bg-slate-700">
          🔊 BGM: ON
        </button>
      </div>

      <div class="text-[9px] text-slate-400 space-y-2 max-w-xs">
        <p><span class="text-cyan-400">CONTROLS:</span> Arrow Keys / WASD or Touch & Drag to Move</p>
        <p><span class="text-cyan-400">FIRE:</span> SPACEBAR or Auto-fire on Touch</p>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="absolute inset-0 bg-slate-950/95 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-20 hidden">
      <h2 class="text-3xl sm:text-4xl text-red-500 glow-pink mb-2">SYSTEM CRASH</h2>
      <p class="text-[10px] text-slate-400 mb-6">MISSION FAILED</p>
      
      <div class="bg-slate-900 border border-cyan-500/30 rounded-xl p-4 w-full max-w-xs mb-6 space-y-3">
        <div class="flex justify-between text-xs">
          <span class="text-slate-400">FINAL SCORE</span>
          <span id="final-score" class="text-cyan-400 glow-cyan">0</span>
        </div>
        <div class="flex justify-between text-xs">
          <span class="text-slate-400">HIGH SCORE</span>
          <span id="final-high" class="text-yellow-400 glow-gold">0</span>
        </div>
      </div>

      <button onclick="restartGame()" class="btn-arcade px-8 py-4 rounded-xl text-xs sm:text-sm font-bold text-white cursor-pointer">
        RETRY MISSION
      </button>
    </div>

  </div>

  <script>
    /* WEB AUDIO API CHIPTUNE SYNTHESIZER */
    class RetroSoundFX {
      constructor() {
        this.ctx = null;
        this.bgmEnabled = true;
        this.bgmInterval = null;
        this.step = 0;
      }

      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }

      // Play laser shot sound
      playLaser() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(880, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(110, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
      }

      // Play explosion sound (Noise buffer)
      playExplosion() {
        if (!this.ctx) return;
        const bufferSize = this.ctx.sampleRate * 0.25;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(800, this.ctx.currentTime);
        filter.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + 0.25);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start();
      }

      // Play Powerup arpeggio sound
      playPowerup() {
        if (!this.ctx) return;
        const notes = [261.63, 329.63, 392.00, 523.25];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.05);
          gain.gain.setValueAtTime(0.1, this.ctx.currentTime + idx * 0.05);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.05 + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + idx * 0.05);
          osc.stop(this.ctx.currentTime + idx * 0.05 + 0.08);
        });
      }

      // Procedural Chiptune BGM Loop
      startBGM() {
        if (!this.ctx || this.bgmInterval || !this.bgmEnabled) return;
        const bassline = [110, 110, 130.81, 110, 146.83, 110, 130.81, 98.00];
        const synthNotes = [220, 0, 261.63, 293.66, 0, 329.63, 261.63, 196.00];
        this.step = 0;

        this.bgmInterval = setInterval(() => {
          if (!this.bgmEnabled || !this.ctx) return;
          
          // Play Bass note
          const bassFreq = bassline[this.step % bassline.length];
          if (bassFreq > 0) {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(bassFreq, this.ctx.currentTime);
            gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.12);
          }

          // Play Synth Lead note
          const leadFreq = synthNotes[this.step % synthNotes.length];
          if (leadFreq > 0) {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(leadFreq, this.ctx.currentTime);
            gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.005, this.ctx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.1);
          }

          this.step++;
        }, 150);
      }

      stopBGM() {
        if (this.bgmInterval) {
          clearInterval(this.bgmInterval);
          this.bgmInterval = null;
        }
      }
    }

    const audio = new RetroSoundFX();

    function toggleAudio() {
      audio.bgmEnabled = !audio.bgmEnabled;
      const btn = document.getElementById('bgm-toggle');
      btn.textContent = audio.bgmEnabled ? '🔊 BGM: ON' : '🔇 BGM: OFF';
      if (!audio.bgmEnabled) audio.stopBGM();
      else if (gameRunning) audio.startBGM();
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let canvasWidth, canvasHeight;
    function resizeCanvas() {
      const container = document.getElementById('game-container');
      canvasWidth = canvas.width = container.clientWidth;
      canvasHeight = canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Game Core State
    let gameRunning = false;
    let score = 0;
    let highScore = localStorage.getItem('neon_high_score') || 0;
    let lives = 3;
    let combo = 1;
    let comboTimer = null;
    let shakeDuration = 0;
    let frameCount = 0;

    // Control States
    const keys = { ArrowLeft: false, ArrowRight: false, ArrowUp: false, ArrowDown: false, a: false, d: false, w: false, s: false, ' ': false };
    let touchX = null, touchY = null;

    window.addEventListener('keydown', e => { if (e.key in keys || e.key === ' ') keys[e.key] = true; });
    window.addEventListener('keyup', e => { if (e.key in keys || e.key === ' ') keys[e.key] = false; });

    // Touch support for mobile gameplay
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      touchX = e.touches[0].clientX - rect.left;
      touchY = e.touches[0].clientY - rect.top;
      keys[' '] = true;
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      touchX = e.touches[0].clientX - rect.left;
      touchY = e.touches[0].clientY - rect.top;
    }, { passive: false });

    canvas.addEventListener('touchend', e => {
      touchX = null; touchY = null; keys[' '] = false;
    });

    // Player Ship Object
    const player = {
      x: 0, y: 0, w: 32, h: 32, speed: 6,
      fireRate: 12, lastFire: 0, tripleShot: 0,
      reset() {
        this.x = canvasWidth / 2 - this.w / 2;
        this.y = canvasHeight - 80;
        this.tripleShot = 0;
      },
      update() {
        // Keyboard movement
        if ((keys.ArrowLeft || keys.a) && this.x > 0) this.x -= this.speed;
        if ((keys.ArrowRight || keys.d) && this.x < canvasWidth - this.w) this.x += this.speed;
        if ((keys.ArrowUp || keys.w) && this.y > 0) this.y -= this.speed;
        if ((keys.ArrowDown || keys.s) && this.y < canvasHeight - this.h) this.y += this.speed;

        // Smooth Touch movement
        if (touchX !== null) {
          this.x += (touchX - (this.x + this.w / 2)) * 0.15;
          this.y += (touchY - (this.y + this.h / 2)) * 0.15;
        }

        // Weapon Firing Logic
        if (keys[' '] && frameCount - this.lastFire > this.fireRate) {
          audio.playLaser();
          this.lastFire = frameCount;
          if (this.tripleShot > 0) {
            bullets.push(new Bullet(this.x + this.w / 2, this.y, 0, -10));
            bullets.push(new Bullet(this.x + this.w / 2, this.y, -3, -9));
            bullets.push(new Bullet(this.x + this.w / 2, this.y, 3, -9));
            this.tripleShot--;
          } else {
            bullets.push(new Bullet(this.x + this.w / 2, this.y, 0, -10));
          }
        }
      },
      draw() {
        ctx.save();
        ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
        
        // Ship Engine Glow
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00f0ff';
        
        // Draw Retro Triangle Ship Shape
        ctx.strokeStyle = '#00f0ff';
        ctx.fillStyle = '#05182e';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -this.h / 2);
        ctx.lineTo(this.w / 2, this.h / 2);
        ctx.lineTo(0, this.h / 3);
        ctx.lineTo(-this.w / 2, this.h / 2);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Engine Flame FX
        ctx.fillStyle = Math.random() > 0.5 ? '#ff007f' : '#ffd700';
        ctx.beginPath();
        ctx.moveTo(-5, this.h / 3 + 2);
        ctx.lineTo(5, this.h / 3 + 2);
        ctx.lineTo(0, this.h / 2 + Math.random() * 12 + 4);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }
    };

    // Arrays for Game Entities
    let stars = [], bullets = [], enemies = [], particles = [], powerups = [];

    // Background Stars Class
    class Star {
      constructor() {
        this.x = Math.random() * canvasWidth;
        this.y = Math.random() * canvasHeight;
        this.size = Math.random() * 2 + 0.5;
        this.speed = Math.random() * 2 + 0.5;
        this.color = ['#ffffff', '#00f0ff', '#ff007f'][Math.floor(Math.random() * 3)];
      }
      update() {
        this.y += this.speed;
        if (this.y > canvasHeight) {
          this.y = 0;
          this.x = Math.random() * canvasWidth;
        }
      }
      draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
      }
    }

    // Laser Bullet Class
    class Bullet {
      constructor(x, y, vx, vy) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.w = 4; this.h = 12;
      }
      update() { this.x += this.vx; this.y += this.vy; }
      draw() {
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#00f0ff';
        ctx.fillStyle = '#00f0ff';
        ctx.fillRect(this.x - this.w / 2, this.y, this.w, this.h);
        ctx.shadowBlur = 0;
      }
    }

    // Enemy Space Ship Class
    class Enemy {
      constructor() {
        this.w = 28; this.h = 28;
        this.x = Math.random() * (canvasWidth - this.w);
        this.y = -this.h;
        this.speed = Math.random() * 2 + 1.5 + (score / 500);
        this.type = Math.random() > 0.7 ? 'zigzag' : 'straight';
        this.angle = 0;
      }
      update() {
        this.y += this.speed;
        if (this.type === 'zigzag') {
          this.angle += 0.05;
          this.x += Math.sin(this.angle) * 3;
        }
      }
      draw() {
        ctx.save();
        ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff007f';
        ctx.strokeStyle = '#ff007f';
        ctx.fillStyle = '#2b0015';
        ctx.lineWidth = 2;

        // Draw Invader Grid Diamond Shape
        ctx.beginPath();
        ctx.moveTo(0, this.h / 2);
        ctx.lineTo(this.w / 2, 0);
        ctx.lineTo(0, -this.h / 2);
        ctx.lineTo(-this.w / 2, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.restore();
      }
    }

    // Particle Explosion FX
    class Particle {
      constructor(x, y, color) {
        this.x = x; this.y = y; this.color = color;
        this.vx = (Math.random() - 0.5) * 8;
        this.vy = (Math.random() - 0.5) * 8;
        this.alpha = 1;
        this.size = Math.random() * 3 + 1;
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        this.alpha -= 0.03;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
        ctx.restore();
      }
    }

    // Triple Shot Powerup Drop Class
    class Powerup {
      constructor(x, y) {
        this.x = x; this.y = y; this.w = 20; this.h = 20;
      }
      update() { this.y += 1.5; }
      draw() {
        ctx.save();
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ffd700';
        ctx.fillStyle = '#ffd700';
        ctx.font = '10px "Press Start 2P"';
        ctx.fillText('P', this.x, this.y);
        ctx.restore();
      }
    }

    function spawnEnemies() {
      if (frameCount % Math.max(20, 60 - Math.floor(score / 200)) === 0) {
        enemies.push(new Enemy());
      }
    }

    function createExplosion(x, y, color = '#ff007f') {
      audio.playExplosion();
      shakeDuration = 10;
      for (let i = 0; i < 20; i++) {
        particles.push(new Particle(x, y, color));
      }
    }

    function triggerCombo() {
      combo++;
      const comboTxt = document.getElementById('combo-text');
      comboTxt.textContent = `${combo}x COMBO!`;
      comboTxt.style.opacity = '1';
      clearTimeout(comboTimer);
      comboTimer = setTimeout(() => {
        combo = 1;
        comboTxt.style.opacity = '0';
      }, 2500);
    }

    function updateHUD() {
      document.getElementById('score-val').textContent = score;
      document.getElementById('high-val').textContent = Math.max(score, highScore);
      
      const livesContainer = document.getElementById('lives-container');
      livesContainer.innerHTML = '';
      for (let i = 0; i < lives; i++) {
        livesContainer.innerHTML += '▲ ';
      }
    }

    // Core Animation & Physics Loop
    function gameLoop() {
      if (!gameRunning) return;
      frameCount++;

      // Canvas Screen Shake Effect
      ctx.save();
      if (shakeDuration > 0) {
        ctx.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
        shakeDuration--;
      }

      ctx.clearRect(0, 0, canvasWidth, canvasHeight);

      // Render Starfield
      stars.forEach(s => { s.update(); s.draw(); });

      // Player Updates
      player.update();
      player.draw();

      // Bullets Handling
      bullets.forEach((b, bi) => {
        b.update();
        b.draw();
        if (b.y < -20) bullets.splice(bi, 1);
      });

      // Enemies Handling & Collisions
      enemies.forEach((e, ei) => {
        e.update();
        e.draw();

        // Check Bullet Collision with Enemy
        bullets.forEach((b, bi) => {
          if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
            createExplosion(e.x + e.w / 2, e.y + e.h / 2, '#ff007f');
            
            // Random Powerup drop (15% chance)
            if (Math.random() < 0.15) powerups.push(new Powerup(e.x, e.y));

            triggerCombo();
            score += 100 * combo;
            enemies.splice(ei, 1);
            bullets.splice(bi, 1);
            updateHUD();
          }
        });

        // Check Player Collision with Enemy
        if (e.x < player.x + player.w && e.x + e.w > player.x &&
            e.y < player.y + player.h && e.y + e.h > player.y) {
          createExplosion(player.x + player.w / 2, player.y + player.h / 2, '#00f0ff');
          enemies.splice(ei, 1);
          lives--;
          updateHUD();

          if (lives <= 0) gameOver();
        }

        // Enemy passed screen bottom
        if (e.y > canvasHeight) enemies.splice(ei, 1);
      });

      // Powerups Handling
      powerups.forEach((p, pi) => {
        p.update();
        p.draw();
        if (p.x < player.x + player.w && p.x + p.w > player.x &&
            p.y < player.y + player.h && p.y + p.h > player.y) {
          audio.playPowerup();
          player.tripleShot += 30; // 30 powered shots
          powerups.splice(pi, 1);
        }
        if (p.y > canvasHeight) powerups.splice(pi, 1);
      });

      // Render Particle Explosion Trail
      particles.forEach((p, pi) => {
        p.update();
        p.draw();
        if (p.alpha <= 0) particles.splice(pi, 1);
      });

      spawnEnemies();
      ctx.restore();

      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      audio.init();
      audio.startBGM();

      // Init star background
      stars = Array.from({ length: 60 }, () => new Star());
      bullets = []; enemies = []; particles = []; powerups = [];

      score = 0; lives = 3; combo = 1;
      player.reset();
      updateHUD();

      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('game-over-screen').classList.add('hidden');
      document.getElementById('hud').classList.remove('hidden');

      gameRunning = true;
      requestAnimationFrame(gameLoop);
    }

    function gameOver() {
      gameRunning = false;
      audio.stopBGM();

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('neon_high_score', highScore);
      }

      document.getElementById('final-score').textContent = score;
      document.getElementById('final-high').textContent = highScore;
      document.getElementById('game-over-screen').classList.remove('hidden');
    }

    function restartGame() {
      startGame();
    }
  </script>
</body>
</html>
